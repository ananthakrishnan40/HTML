<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function temp1(){
            setTimeout(()=>{
                console.log('Task Compleate... Q1');
                return true;
            },2000);
        }

        async function q1(){
            await temp1();
        }
        q1()

        async function q2(userName){
            await setTimeout(()=>{
                console.log(`User name : ${userName} q2`);
            },3000);
        }

        q2('AnanthaKrishnan');

        async function q3Addition(a,b){
            await setTimeout(()=>{
                console.log(`${a+b} q3`);
            },1000);
        }

        q3Addition(10,20);


    </script>
    
</body>
</html>
