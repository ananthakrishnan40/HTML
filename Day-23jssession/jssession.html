<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display:flex;
            flex-direction:column;
            justify-content: center;
            align-items:center;

        }

        .centerfloat{
            display:flex;
            flex-direction:column;
            justify-content: center;
            align-items:left;
            border: 2px solid black;
            border-radius: 8px;
            width: 80%;
            transition: all .3s;
            margin-top: 5%;
        }
        .centerfloat:hover{
            box-shadow:0px 0px 100px 50px gray;
            background-color: wheat;
            transform: scale(1.1);
        }
        .inputs{
            height:50px;
            width: 800px;
            border-radius: 8px;
            margin: 20px;
        }

        .label{
            font-size: large;
            transition: all .3s;
            box-shadow: 0 0 20px 100 whitesmoke;
            margin:20px;
            margin-left: 5%;

        }
        .label:hover{
            transform: translateX(5%) scale(1.1);
        }

    </style>
</head>
<body>

    <div class="centerfloat">
        <h1 style="text-align:center"> Customer Feedback form </h1>
        <label class="label" for="name">
            Full name:
            <input class="inputs" type="text" placeholder="Enter full name" id="name">  <!--full name id = name-->
        </label>
        <label for="email" class="label">
            Enter Email
            <input class="inputs" type="email" id="email" placeholder="abc@xyz.com">  <!--email id = email-->
        </label>


        <label for="reason" class="label"> <!--Reason class name = reason-->
            <h2>Reason for Visit</h2>
            <br>
                <label class="label" for="reasin">
                    Product Purchase
                    <input type="radio" name="reason" value="buy">
                </label>
                
                <label class="label">
                    Customer Support
                    <input type="radio" name="reason" value="Customer_support">
                </label>

                <label class="label" for=" Browsing/Research">
                    Browsing / Research
                    <input type="radio" name="reason" value=" Browsing / Research" id=" Browsing/Research">
                </label>

                <label class="label" for=" Browsing/Research">
                    Other
                    <input type="radio" name="reason" value="Other" id="Other">
                </label>
        </label>


        <label for="satisfaction" class="label">  <!--Satisfation class name = satisfaction-->
            <h2>Over All Satisfaction :</h2>
            <br>
            <label for="s1" class="label">
                1.Vary Disatisfied :
                <input type="radio" id="s1" name="satisfaction" value="Very Disatisfied">
            </label>

            <label for="s2" class="label">
                2.Disatisfied :
                <input type="radio" id="s2" name="satisfaction" value="Disatisfied">
            </label>

            <label for="s3" class="label">
                3:Nutral :
                <input type="radio" id="s3" name="satisfaction" value="Nutral">
            </label>
            
            <label for="s4" class="label">
                4:Satisfied :
                <input type="radio" id="s4" name="satisfaction" value="Satisfied">
            </label>

            <label for="s5" class="label">
                5:Vary satisfied
                <input type="radio" id="s5" name="satisfaction" value="Very satisfied">
            </label>

        </label>



        <label for="Quality" class="label">   <!-- quality class name = quality -->
            <h2>Product/Service Quality</h2>
            <br>
            <label for="q3" class="label">
                Excelent :
                <input type="radio" name="quality" id="q1" value="Excelent">
            </label>

            <label for="q2" class="label">
                Very Good :
                <input type="radio" name="quality" id="q2" value="Very_good">
            </label>

            <label for="q3" class="label">
                Good :
                <input type="radio" name="quality" id="q3" value="Good">
            </label>

            <label for="q4" class="label">
                Average :
                <input type="radio" name="quality" id="q4" value="Average">
            </label>

            <label for="q5" class="label">
                bad
                <input type="radio" name="quality" id="q5" value="Bad">
            </label>

            <label for="q6" class="label">
                Very bad :
                <input type="radio" name="quality" id="q6" value="Very_bad">
            </label>
        </label>



        <label for="Customer support" class="label">    <!--customer support name = customer-->
            <h2>
                Staff / Customer Support Helpfulness
            </h2>
            <br>
            <label for="c1" class="label">
                N/A - No interaction
                <input type="radio" name="customer" id="c1" value="No_interaction">
            </label>

            <label for="c2" class="label">
                Extremely Helpful
                <input type="radio" name="customer" id="c2" value="Extremely_helpfull">
            </label>

            <label for="c3" class="label">
                Somewhat Helpful
                <input type="radio" name="customer" id="c3" value="Somewhat_helpful">
            </label>

            <label for="c4" class="label">
                Unhelpful
                <input type="radio" name="customer" id="c4" value='Unhelpful'>
            </label>
        </label>

        <label for="" style="display : flex; flex-flow:row wrap" class="label">     <!--id = recommend-->
            <h2>How likely are you to recommend us to a friend? :</h2>
            <select name="recommend" id="recommend">
                <option value="" selected desabled>select a value</option>
                <option value="1">1</option>
                <option value="1">2</option>
                <option value="1">3</option>
                <option value="1">4</option>
                <option value="1">5</option>
            </select>
        </label>

        <label for="comments" class="label">
            <h2>
                How can we Improve :
            </h2>
            <textarea name="" id="comments" rows="20" cols="50" placeholder="Leave your thoughts here"></textarea>
        </label>


        <button onclick="session()">Upload data</button>
    </div>

<!--Reason class name = reason-->  //
<!--Satisfation class name = satisfaction-->  //
<!--customer support name = customer-->  //
<!-- quality class name = quality --> //
<!--recommend id = recommend-->

    <script>
        function session(){
            let data = {}



            const name = document.getElementById('name').value;      //name to session storage
            sessionStorage.setItem('name',name);
            console.log(`name ${name}`);
            data['name'] = name;
            

            const email = document.getElementById('email').value;    //email to session storage
            sessionStorage.setItem('email',email);
            console.log(`Email ${email}`);
            data['email'] = email;

            const reason = document.querySelector("input[name='reason']:checked");   //reason to session 
            if(reason){
                sessionStorage.setItem('reason',reason.value);
                console.log(`reason ${reason.value}`);
                data['reason'] = reason.value;

            }

            const satisfaction = document.querySelector("input[name='satisfaction']:checked"); //satisfaction to session
            if(satisfaction){
                sessionStorage.setItem('satisfaction',satisfaction.value);
                console.log(`satisfaction :  ${satisfaction.value}`);
                data['satisfaction']=satisfaction.value;
            }

            const customer = document.querySelector("input[name='customer']:checked");  //customer satisfaction to session 
            if(customer){
                sessionStorage.setItem('customer_satisfaction',customer.value);
                console.log(`customer satisfaction ${customer.value}`);
                data['customer_satisfaction']=customer.value
            }

            const quality = document.querySelector("input[name = 'quality']"); //product quality
            if(quality){
                sessionStorage.setItem('product quality',quality.value);
                console.log(`product quality : ${quality.value}`);
                data['quality_product'] = quality.value;
            }

            const recommend = document.getElementById('recommend');
            if(recommend){
                sessionStorage.setItem('recommend',recommend.value);
                console.log(`recommend :`,recommend.value);
                data['recommend'] = recommend.value
            }

            const comments = document.getElementById('comments')
            if(comments){
                sessionStorage.setItem('comments',comments.value);
                data['comments'] = comments.value;
                console.log(`comments : ${comments.value}`)

            }


            let alertvalue = JSON.stringify(data);
            alert(alertvalue);



        }


    </script>
    
</body>
</html>
