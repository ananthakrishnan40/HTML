function q13() {
    let n = 17;
    let c = 0;

    for (let i = 1; i <= n; i++) {
        if (n % i == 0) {
            c++;
        }
    }

    if (c == 2) {
        console.log("Prime");
    } else {
        console.log("Not Prime");
    }
}

    }
}

function q15() {
    let n = 153;
    let t = n;
    let a = 0;

    while (t > 0) {
        let d = t % 10;
        a += d ** 3;
        t = Math.floor(t / 10);
    }

    if (a == n) {
        console.log("Armstrong");
    } else {
        console.log("Not Armstrong");
    }
}

function q20() {
    let w = "MALAYALAM";
    let r = "";

    for (let i = w.length - 1; i >= 0; i--) {
        r += w[i];
    }

    if (w == r) {
        console.log("Palindrome");
    } else {
        console.log("Not Palindrome");
    }
